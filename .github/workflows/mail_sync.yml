# ============================================================================
# [2nd PIPELINE - PUSH MODEL] SharePoint -> mail dead-drop sync
# Power Automate reads the SharePoint input folder every Sunday 06:00 local and
# mails the whole input bundle to a dedicated mailbox. This workflow fetches the
# attachments (scripts/fetch_mail.py), checks the semester has not ended
# (scripts/semester_guard.py), recomputes outputs and opens an auto-merged PR.
#
# Required repo secrets:
#   MAIL_IMAP_USER       dead-drop mailbox address
#   MAIL_IMAP_PASSWORD   app password for that mailbox (used for IMAP and SMTP)
#   MAIL_ALLOWED_FROM    the address Power Automate sends from
#   MAIL_OUTBOX_TO       address the outbound Power Automate flow watches, which
#                        writes the returned bundle back into SharePoint
#
# Replaces the SharePoint pull in compute_weekly.yml (1st pipeline).
# Once verified: delete compute_weekly.yml and the FORMS_XLSX_URL secret, and
# untrack PeerGrading/Input/** (it is .gitignore'd but still tracked today, and
# the legacy pipeline still needs those files present in the checkout).
# ============================================================================
name: Mail sync + compute weekly peer grading (2nd pipeline)

on:
  schedule:
    - cron: "15 4 * * SUN"  # CEST: 06:15 Sun local (PA sends 06:00)
    - cron: "15 5 * * SUN"  # CET:  06:15 Sun local
  workflow_dispatch:
    inputs:
      week:
        description: "Which week_id to compute (e.g., W01). Use ALL for all."
        required: true
        default: "ALL"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: peergrading-weekly  # same group as 1st pipeline -> never run concurrently
  cancel-in-progress: false

jobs:
  fetch-and-compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pulls the whole bundle: Forms export, roster, week_windows.csv and
      # semester.csv. A partial bundle fails the run on purpose.
      - name: Fetch input bundle from dead-drop mailbox
        env:
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          MAIL_ALLOWED_FROM: ${{ secrets.MAIL_ALLOWED_FROM }}
          MAIL_SUBJECT_FILTER: "PeerGrading Data Sync"
        run: python scripts/fetch_mail.py

      # Reads the expiry dates out of semester.csv. Past the deadline this ships
      # the semester archive, mails the TA once and stops the run silently; see
      # scripts/semester_guard.py.
      - name: Check semester expiry
        id: guard
        env:
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          MAIL_OUTBOX_TO: ${{ secrets.MAIL_OUTBOX_TO }}
        run: python scripts/semester_guard.py

      - name: Run compute
        if: steps.guard.outputs.expired != 'true'
        run: |
          mkdir -p PeerGrading/Output
          python scripts/compute_weekly.py --week "${{ inputs.week || 'ALL' }}"

      # Mails the output bundle to the mailbox the second Power Automate flow
      # watches, which writes it into SharePoint.
      - name: Push outputs to SharePoint
        if: steps.guard.outputs.expired != 'true'
        env:
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          MAIL_OUTBOX_TO: ${{ secrets.MAIL_OUTBOX_TO }}
        run: python scripts/push_outputs.py --mode weekly

      - name: Detect changes
        id: changes
        run: |
          echo "=== git status (porcelain) ==="
          git status --porcelain || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Runs even when the semester has expired, so the closure marker gets
      # committed and the next scheduled run knows to stay quiet.
      - name: Create PR if changed
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: bot/mail-sync-outputs  # distinct from 1st pipeline's branch
          delete-branch: true
          title: "Mail sync: Forms export + update outputs"
          commit-message: "Sync Forms export (mail dead-drop) and update outputs"
          add-paths: |
            PeerGrading/Input/form_exports/forms_responses.xlsx
            PeerGrading/Output

      - name: Enable auto-merge
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
